<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrustTrade BD — Secure P2P Marketplace</title>
    <meta name="description" content="Buy and sell safely with escrow protection." />
    <!-- Theme & Mobile UX -->
    <meta name="theme-color" content="#090d16" />

    <!-- Google Fonts Optimization (Non-blocking with swap) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    </noscript>

    <!-- DNS-Prefetch for external image sources to eliminate TLS handshake latency -->
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://startech.com.bd" />
    <link rel="dns-prefetch" href="https://rokbucket.rokomari.io" />
    <link rel="dns-prefetch" href="https://cdn11.bigcommerce.com" />
    <link rel="dns-prefetch" href="https://applegadgetsbd.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
